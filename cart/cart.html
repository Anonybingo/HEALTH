<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | HEALTH CENTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;300;400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="cart.css" />
</head>
<body>
  <div class="custom-cursor" id="customCursor"></div>

  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo">HEALTH CENTER</div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="../index.html" class="nav-link">HOME</a></li>
        <li class="nav-item"><a href="../pharmacy/pharmacy.html" class="nav-link">PHARMACY</a></li>
        <li class="nav-item"><a href="../index.html#about" class="nav-link">ABOUT</a></li>
        <li class="nav-item"><a href="../index.html#contact" class="nav-link">CONTACT</a></li>
        <li class="nav-item">
          <a href="../auth/auth.html" class="nav-link" id="navAuthLink">SIGN IN</a>

          <ul class="auth-dropdown" id="authDropdown" style="display: none;">
            <li><a href="../profile/profile.html">Profile</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="../history/history.html">Order History</a></li>
            <li><a href="../chat/chat.html">Live Chat</a></li>
            <li><a href="../settings/settings.html">Settings</a></li>
            <li><button data-logout class="logout-btn">Logout</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <section class="cart-section">
    <div class="cart-header reveal active">
      <h2 class="section-title">YOUR CART</h2>
      <div class="title-line"></div>
    </div>

    <div class="cart-layout">
      <div class="cart-items" id="cartItems">
        <p class="empty-state">LOADING CART…</p>
      </div>

      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>SUBTOTAL</span>
          <span id="cartSubtotal">$0.00</span>
        </div>
        <p class="cart-summary-note">DELIVERY FEES ARE CALCULATED AT CONFIRMATION.</p>
        <button type="button" class="magnetic-btn submit-btn cart-checkout-btn" id="checkoutBtn" disabled>
          PROCEED TO CHECKOUT
        </button>
        <p class="cart-toast" id="cartToast"></p>
      </div>
    </div>
  </section>

  <script src="../script/cursor.js"></script>
  <script type="module" src="cart.js"></script>
  <script type="module">
    import { initNavAuth } from "../firebase/nav-auth.js";
    initNavAuth("../");
  </script>
</body>
</html>
