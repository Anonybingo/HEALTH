<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Access | HEALTH CENTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;300;400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="custom-cursor" id="customCursor"></div>

  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo">HEALTH CENTER</div>
      <ul class="nav-menu">
        <li class="nav-item"><a href="../index.html" class="nav-link">HOME</a></li>
        <li class="nav-item"><a href="../pharmacy/pharmacy.html" class="nav-link">PHARMACY</a></li>
        <li class="nav-item"><a href="../index.html#about" class="nav-link">ABOUT</a></li>
        <li class="nav-item"><a href="../index.html#contact" class="nav-link">CONTACT</a></li>
      </ul>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-card">
      <div class="auth-head">
        <h2 class="section-title">ACCOUNT ACCESS</h2>
        <div class="title-line" style="margin: 0 auto 20px auto;"></div>
        <p class="auth-sub">SIGN IN TO ORDER, TRACK PRESCRIPTIONS, AND CHAT WITH YOUR PHARMACIST.</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="signin">SIGN IN</button>
        <button type="button" class="auth-tab" data-tab="signup">CREATE ACCOUNT</button>
      </div>

      <p class="auth-error" id="authError"></p>

      <!-- Sign In -->
      <form class="auth-form active" id="signinForm" novalidate>
        <div class="input-group">
          <input type="email" id="signinEmail" required />
          <label for="signinEmail">EMAIL</label>
        </div>
        <div class="input-group">
          <input type="password" id="signinPassword" required minlength="6" />
          <label for="signinPassword">PASSWORD</label>
        </div>
        <button type="submit" class="magnetic-btn submit-btn auth-submit">
          <span class="btn-label">SIGN IN</span>
        </button>
      </form>

      <!-- Sign Up -->
      <form class="auth-form" id="signupForm" novalidate>
        <div class="input-group">
          <input type="text" id="signupName" required />
          <label for="signupName">FULL NAME</label>
        </div>
        <div class="input-group">
          <input type="email" id="signupEmail" required />
          <label for="signupEmail">EMAIL</label>
        </div>
        <div class="input-group">
          <input type="password" id="signupPassword" required minlength="6" />
          <label for="signupPassword">PASSWORD (MIN 6 CHARACTERS)</label>
        </div>
        <div class="input-group">
          <input type="password" id="signupConfirm" required minlength="6" />
          <label for="signupConfirm">CONFIRM PASSWORD</label>
        </div>
        <button type="submit" class="magnetic-btn submit-btn auth-submit">
          <span class="btn-label">CREATE ACCOUNT</span>
        </button>
      </form>
    </div>
  </section>

  <script src="../script/cursor.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
